name: Ejecutor de Tareas ETL

# Configuración de los disparadores (cuándo se ejecuta)
on:
  # Permite ejecutar el flujo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

  # Ejecución programada mediante Cron (Sintaxis UTC)
  schedule:
    # Ejemplo: Se ejecuta todos los días a las 02:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # O la versión de Python que utilices

      # 3. Instalar las dependencias (si tienes un archivo requirements.txt)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Crear carpeta de logs para que no falle al guardar
      - name: Crear directorio de logs
        run: mkdir -p logs

      # 5. Ejecutar los scripts de Python en orden
      - name: Ejecutar Recolector Crudo
        run: python src/etl/recolector_crudo.py >> logs/recolector.log 2>&1

      - name: Ejecutar Agregador Horario
        run: python src/etl/agregador_horario.py >> logs/agregador.log 2>&1

      # 6. Guardar los logs como artefactos para poder descargarlos si falla algo
      - name: Guardar logs de ejecución
        uses: actions/upload-artifact@v4
        if: always() # Se ejecuta aunque fallen los pasos anteriores
        with:
          name: logs-ejecucion
          path: logs/