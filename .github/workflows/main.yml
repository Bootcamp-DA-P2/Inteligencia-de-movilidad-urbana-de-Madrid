name: Ejecutor de Tareas ETL

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '0 2 * * *'

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instala dependencias e ignora versiones fijas que fallen
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            # Si la instalación estricta falla por una versión errónea,
            # instala las librerías quitando el fijado estricto (==)
            pip install -r requirements.txt || sed -i 's/==.*/ /g' requirements.txt && pip install -r requirements.txt
          fi

      - name: Crear carpeta de logs
        run: mkdir -p logs

      - name: Ejecutar Recolector Crudo
        run: python src/etl/recolector_crudo.py

      - name: Ejecutar Agregador Horario
        run: python src/etl/agregador_horario.py

      - name: Subir artefactos de logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-ejecucion
          path: logs/
