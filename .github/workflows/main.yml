name: Ejecutor de Tareas ETL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Crear directorio de logs
        run: mkdir -p logs

      - name: Ejecutar Recolector Crudo
        run: python src/etl/recolector_crudo.py >> logs/recolector.log 2>&1

      - name: Ejecutar Agregador Horario
        run: python src/etl/agregador_horario.py >> logs/agregador.log 2>&1

      - name: Guardar logs de ejecución
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-ejecucion
          path: logs/
