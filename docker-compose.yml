version: '3.8'

services:
  # 1. Página Web Informativa (index.html con Nginx)
  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "80:80"
    restart: always

  # 2. Backend (Django)
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    command: sh -c "python backend/manage.py migrate && python backend/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistencia de la BDDD SQLite fuera del contenedor
      - sqlite_data:/app/backend

  # 3. Frontend (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    command: python -m streamlit run src/frontend/main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  sqlite_data: